<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rolling Wrench AI - Heavy Duty Cockpit HUD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            voidBlack: '#0a0d12',
            cockpitPanel: '#161b22',
            neonOrange: '#ff6600',
            neonGreen: '#26d057',
            textMuted: '#6e7f91'
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap');

    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at center, #10151d 0%, #05070a 100%);
      -webkit-font-smoothing: antialiased;
    }

    .font-mono-telemetry {
      font-family: 'JetBrains Mono', monospace;
    }

    .studio-pressed-cavity {
      background: linear-gradient(180deg, #07090d 0%, #0c0f14 100%);
      border-top: 1px solid #020305;
      border-left: 1px solid #040508;
      border-right: 1px solid #1c232e;
      border-bottom: 1px solid #222a38;
      box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.9), 0 1px 2px rgba(255, 255, 255, 0.03);
    }

    .studio-pressed-cavity:active {
      background: linear-gradient(180deg, #040507 0%, #07090d 100%);
      box-shadow: inset 0 8px 16px rgba(0, 0, 0, 0.95);
      transform: scale(.98);
    }

    .studio-raised-card {
      background: linear-gradient(180deg, #182029 0%, #0f141a 100%);
      border: 1px solid #25303f;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.75), inset 0 1px 1px rgba(255, 255, 255, 0.06);
    }

    .studio-raised-card-orange {
      background: linear-gradient(180deg, #1b2129 0%, #11151b 100%);
      border: 1px solid #3d2211;
      box-shadow: 0 0 25px rgba(255, 102, 0, 0.06), 0 10px 20px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    .studio-raised-card-green {
      background: linear-gradient(180deg, #161d24 0%, #0e1217 100%);
      border: 1px solid #11331c;
      box-shadow: 0 0 25px rgba(38, 208, 87, 0.06), 0 10px 20px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.05);
    }

    .glow-text-orange {
      text-shadow: 0 0 8px rgba(255, 102, 0, 0.6);
    }

    .glow-text-green {
      text-shadow: 0 0 8px rgba(38, 208, 87, 0.6);
    }

    .bottom-safe {
      padding-bottom: calc(128px + env(safe-area-inset-bottom));
    }

    .dock-safe {
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
    }

    .module-drawer {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 110%);
      width: 100%;
      max-width: 448px;
      height: 76vh;
      z-index: 80;
      background: #05070a;
      border: 1px solid #18212d;
      border-bottom: 0;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -30px 70px rgba(0,0,0,.9);
      transition: transform .25s ease;
      padding: 16px;
    }

    .module-drawer.open {
      transform: translate(-50%, 0);
    }

    .drawer-card {
      background: linear-gradient(180deg, #101720, #080b10);
      border: 1px solid #1b2531;
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
    }

    .clock-readout {
      background: #04060a;
      border: 1px solid #1a222e;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      box-shadow: inset 0 3px 8px rgba(0,0,0,.9);
    }

    .clock-readout strong {
      display: block;
      color: white;
      font-size: 34px;
      line-height: 1;
    }

    .clock-readout span {
      display: block;
      color: #26d057;
      font-size: 17px;
      margin-top: 9px;
    }
  </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col items-center justify-start p-0 sm:p-4">

  <div class="w-full max-w-md bg-[#05070a] min-h-screen flex flex-col relative bottom-safe shadow-[0_25px_60px_rgba(0,0,0,0.95)] border-x border-gray-900/30">

    <header class="bg-[#090d12] border-b border-[#18202b] px-4 py-4 flex items-center justify-between sticky top-0 z-50 shadow-md">
      <div class="flex items-center space-x-3">
        <button class="text-gray-400 text-xl hover:text-white transition-colors" data-action="open-menu">
          <i class="fa-solid fa-bars-staggered"></i>
        </button>
        <div class="flex items-center space-x-2.5">
          <div class="w-8 h-8 rounded-lg bg-gradient-to-b from-neonOrange to-[#993d00] flex items-center justify-center text-black font-black text-sm shadow-[0_3px_10px_rgba(255,102,0,0.3)] border border-white/20">
            <i class="fa-solid fa-gears"></i>
          </div>
          <div>
            <h1 class="text-xs font-black tracking-widest text-white uppercase leading-none">
              ROLLING <span class="text-neonOrange glow-text-orange">WRENCH</span> AI
            </h1>
            <span class="text-[7.5px] text-textMuted uppercase tracking-widest font-black block mt-1">
              HEAVY DUTY DIAGNOSTIC HUD
            </span>
          </div>
        </div>
      </div>

      <button class="relative bg-gradient-to-b from-[#141b24] to-[#0a0d12] border border-[#253245] p-2.5 rounded-xl text-gray-400 hover:text-white shadow-inner" data-action="notifications">
        <i class="fa-solid fa-bell text-xs"></i>
        <span class="absolute -top-1 -right-1 bg-neonOrange text-white text-[7.5px] font-black px-1.5 py-0.5 rounded-full ring-2 ring-[#090d12]">3</span>
      </button>
    </header>

    <section class="bg-[#030508] border-b border-[#0f141c] px-4 py-2 flex items-center justify-between text-[9px] font-mono-telemetry text-gray-400 shadow-inner">
      <div class="flex items-center space-x-2.5">
        <div class="flex items-center space-x-1.5">
          <span class="h-1.5 w-1.5 rounded-full bg-neonGreen shadow-[0_0_8px_#26d057]"></span>
          <span class="text-white font-bold text-[8.5px]">SYSTEM DATALINK</span>
        </div>
        <span class="text-gray-800">|</span>
        <span class="text-white font-semibold">J1939 BUS</span>
        <span class="text-gray-800">|</span>
        <span class="text-textMuted font-medium">CAN-HD</span>
      </div>
      <span class="text-neonGreen bg-neonGreen/10 border border-neonGreen/30 px-2 py-0.5 rounded text-[8px] font-black tracking-wider shadow-sm">ONLINE</span>
    </section>

    <main class="flex-1 p-4 space-y-4">

      <div class="grid grid-cols-3 gap-3">

        <div class="studio-raised-card rounded-xl p-3 flex flex-col justify-between h-[155px]">
          <div>
            <span class="text-[8px] font-black text-textMuted uppercase tracking-widest block">SCANNER STATUS</span>
            <span class="text-neonGreen text-[7.5px] font-black uppercase block mt-0.5 tracking-tight glow-text-green">● READY</span>
          </div>
          <div class="flex flex-col items-center justify-center my-1 text-center">
            <div class="w-10 h-10 rounded-full bg-[#080b0f] border border-[#1e2733] flex items-center justify-center text-neonGreen shadow-[inset_0_2px_5px_rgba(0,0,0,0.8)] mb-1.5">
              <i class="fa-solid fa-satellite-dish text-sm animate-pulse"></i>
            </div>
            <span class="text-[9px] font-black font-mono-telemetry text-white tracking-tight">9-PIN J1939</span>
          </div>
          <button class="w-full bg-[#11161d] border border-[#202936] text-gray-300 font-extrabold text-[8px] py-1 rounded uppercase tracking-wider transition-colors hover:bg-white/5 shadow-sm" data-action="scanner">
            SCAN
          </button>
        </div>

        <div class="studio-raised-card-orange rounded-xl p-3 flex flex-col justify-between h-[155px] relative overflow-hidden">
          <div>
            <span class="text-[8px] font-black text-neonOrange uppercase tracking-widest block glow-text-orange">ACTIVE TRUCK</span>
            <h4 class="text-[10px] font-black text-white uppercase tracking-tight mt-0.5 leading-tight truncate">Cascadia 126</h4>
          </div>

          <div class="w-full h-12 my-1 flex items-center justify-center drop-shadow-[0_4px_8px_rgba(0,0,0,0.9)]">
            <i class="fa-solid fa-truck-moving text-3xl text-gray-300"></i>
          </div>

          <div class="text-[8px] font-mono-telemetry text-gray-300 space-y-0.5 leading-none bg-black/20 p-1 rounded border border-white/5">
            <p class="truncate"><span class="text-textMuted font-bold">ENG:</span> X15</p>
            <p class="truncate"><span class="text-textMuted font-bold">ESN:</span> 79876</p>
          </div>

          <button class="w-full bg-gradient-to-b from-[#26160d] to-[#140b06] border border-[#4d2a15] text-neonOrange font-black text-[8px] py-1 rounded uppercase tracking-wider shadow-sm" data-action="profile">
            PROFILE
          </button>
        </div>

        <div class="studio-raised-card-green rounded-xl p-3 flex flex-col justify-between h-[155px]">
          <div>
            <span class="text-[8px] font-black text-textMuted uppercase tracking-widest block">SYSTEM HEALTH</span>
            <span class="text-neonGreen text-[7.5px] font-black uppercase block mt-0.5 tracking-tight glow-text-green">● OPTIMAL</span>
          </div>

          <div class="flex flex-col items-center justify-center my-1">
            <div class="relative w-11 h-11 flex items-center justify-center rounded-full border-4 border-neonGreen/10 border-t-neonGreen shadow-[0_0_12px_rgba(38,208,87,0.2)] bg-black/40">
              <span class="text-[9.5px] font-black text-white font-mono-telemetry">98%</span>
            </div>
            <span class="text-[7.5px] text-neonGreen font-bold mt-1 uppercase tracking-tight">VEHICLE DATA</span>
          </div>

          <button class="w-full bg-[#0a140f] border border-[#163322] text-neonGreen font-black text-[8px] py-1 rounded uppercase tracking-wider shadow-sm" data-action="health">
            DETAILS
          </button>
        </div>

      </div>

      <div class="relative">
        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-textMuted text-sm">
          <i class="fa-solid fa-magnifying-glass"></i>
        </span>
        <input id="masterSearch" type="text" placeholder="Search VIN, Components, Symptoms, Fault Codes..." class="w-full bg-[#04060a] border border-[#1a222e] rounded-xl pl-10 pr-12 py-3 text-xs text-gray-100 placeholder-[#3e4d5e] focus:outline-none focus:border-neonOrange/40 font-medium shadow-[inset_0_3px_6px_rgba(0,0,0,0.9)]">
        <button class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-textMuted text-sm hover:text-neonOrange transition-colors cursor-pointer" data-action="search">
          <i class="fa-solid fa-barcode"></i>
        </button>
      </div>

      <div class="grid grid-cols-3 gap-3" id="toolGrid"></div>

      <div class="grid grid-cols-2 gap-3 pt-1 text-[8.5px] font-bold font-mono-telemetry">
        <div class="bg-[#05070a] border border-[#161f2b] p-2.5 rounded-xl flex items-center justify-between shadow-inner">
          <div class="flex items-center space-x-2">
            <span class="h-1.5 w-1.5 rounded-full bg-neonGreen shadow-[0_0_6px_#26d057]"></span>
            <span class="text-gray-400 uppercase text-[7.5px]">CAN GATEWAY</span>
          </div>
          <span class="text-neonGreen font-black tracking-wider text-[7.5px] glow-text-green">LINKED</span>
        </div>
        <div class="bg-[#05070a] border border-[#161f2b] p-2.5 rounded-xl flex items-center justify-between shadow-inner">
          <div class="flex items-center space-x-2">
            <span class="h-1.5 w-1.5 rounded-full bg-neonGreen shadow-[0_0_6px_#26d057]"></span>
            <span class="text-gray-400 uppercase text-[7.5px]">AI SYSTEM</span>
          </div>
          <span class="text-neonGreen font-black tracking-wider text-[7.5px] glow-text-green">ONLINE</span>
        </div>
      </div>

    </main>

    <nav class="bg-[#070a0f]/95 backdrop-blur-lg border-t border-[#18212d] fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md z-50 flex justify-around items-center py-3 dock-safe shadow-[0_-8px_25px_rgba(0,0,0,0.9)]">
      <button class="nav-btn flex flex-col items-center text-neonOrange focus:outline-none group" data-nav="Home">
        <span class="text-lg drop-shadow-[0_0_8px_rgba(255,102,0,0.5)]"><i class="fa-solid fa-house"></i></span>
        <span class="text-[9px] uppercase tracking-wider font-black mt-1.5 glow-text-orange">Home</span>
      </button>
      <button class="nav-btn flex flex-col items-center text-[#4e5f73] hover:text-white transition-colors focus:outline-none group" data-nav="Doctor">
        <span class="text-lg"><i class="fa-solid fa-stethoscope"></i></span>
        <span class="text-[9px] uppercase tracking-wider font-bold mt-1.5">Doctor</span>
      </button>
      <button class="nav-btn flex flex-col items-center text-[#4e5f73] hover:text-white transition-colors focus:outline-none group" data-nav="Parts">
        <span class="text-lg"><i class="fa-solid fa-gears"></i></span>
        <span class="text-[9px] uppercase tracking-wider font-bold mt-1.5">Parts</span>
      </button>
      <button class="nav-btn flex flex-col items-center text-[#4e5f73] hover:text-white transition-colors focus:outline-none group" data-nav="Repair">
        <span class="text-lg"><i class="fa-solid fa-screwdriver-wrench"></i></span>
        <span class="text-[9px] uppercase tracking-wider font-bold mt-1.5">Repair</span>
      </button>
      <button class="nav-btn flex flex-col items-center text-[#4e5f73] hover:text-white transition-colors focus:outline-none group" data-nav="More">
        <span class="text-lg"><i class="fa-solid fa-ellipsis"></i></span>
        <span class="text-[9px] uppercase tracking-wider font-bold mt-1.5">More</span>
      </button>
    </nav>

    <section id="moduleDrawer" class="module-drawer" aria-hidden="true">
      <div class="flex items-start justify-between border-b border-[#18212d] pb-3">
        <div>
          <span id="drawerLabel" class="text-[8px] text-textMuted font-black uppercase tracking-widest">MODULE</span>
          <h2 id="drawerTitle" class="text-white text-lg font-black mt-1">Module</h2>
        </div>
        <button class="w-9 h-9 rounded-full bg-[#11161d] border border-[#202936] text-white text-xl" data-action="close-drawer">×</button>
      </div>
      <div id="drawerBody" class="pt-4"></div>
    </section>
  </div>

  <script>
    const tools = [
      ["VIN Lookup", "Decode ESN & CPL", "fa-truck-magnifying-glass", "text-orange-400"],
      ["OEM Parts", "Component Diagrams", "fa-cubes", "text-blue-400"],
      ["Fault Doctor", "AI Code Analytics", "fa-user-doctor", "text-emerald-400"],
      ["Repair HUD", "Step-by-Step Data", "fa-screwdriver-wrench", "text-amber-500"],
      ["Smart Quotes", "Estimates Ledger", "fa-file-invoice-dollar", "text-yellow-500"],
      ["Work Orders", "Jobs & Customers", "fa-paste", "text-teal-400"],
      ["Invoices", "Billing Documents", "fa-receipt", "text-indigo-400"],
      ["Time Clock", "Labor Hours Log", "fa-clock", "text-rose-400"],
      ["Camera / OCR", "Scan Spec Plates", "fa-camera", "text-sky-400"],
      ["DOT / GPS", "Fleet Routing Hub", "fa-location-dot", "text-red-400"],
      ["Repair Memory", "Local Diagnostic Cache", "fa-brain", "text-purple-400"],
      ["Suppliers", "Vendor Channels", "fa-handshake", "text-stone-400"],
      ["AI Assistant", "Live Copilot Sync", "fa-robot", "text-cyan-400"],
      ["Reports", "Margin Analytics", "fa-chart-simple", "text-orange-500"],
      ["Settings", "Unit Systems", "fa-sliders", "text-slate-400"]
    ];

    let seconds = 0;
    let running = false;
    let timer = null;
    const laborRate = 135;

    function pad(n){ return String(n).padStart(2, "0"); }
    function timeText(){
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }
    function updateClock(){
      const t = document.getElementById("clockTime");
      const p = document.getElementById("clockPay");
      if(t) t.textContent = timeText();
      if(p) p.textContent = "$" + ((seconds / 3600) * laborRate).toFixed(2);
    }

    function drawer(label, title, body){
      document.getElementById("drawerLabel").textContent = label;
      document.getElementById("drawerTitle").textContent = title;
      document.getElementById("drawerBody").innerHTML = body;
      document.getElementById("moduleDrawer").classList.add("open");
      document.getElementById("moduleDrawer").setAttribute("aria-hidden", "false");
      updateClock();
    }

    function closeDrawer(){
      document.getElementById("moduleDrawer").classList.remove("open");
      document.getElementById("moduleDrawer").setAttribute("aria-hidden", "true");
    }

    function bodyFor(name, sub){
      if(name === "Time Clock"){
        return `
          <div class="clock-readout">
            <strong id="clockTime">00:00:00</strong>
            <span id="clockPay">$0.00</span>
          </div>
          <div class="grid grid-cols-2 gap-3 mt-3">
            <button class="rounded-xl bg-neonGreen text-black font-black py-3 text-xs tracking-widest" data-action="clock-in">CLOCK IN</button>
            <button class="rounded-xl bg-neonOrange text-black font-black py-3 text-xs tracking-widest" data-action="clock-out">CLOCK OUT</button>
          </div>
          <div class="drawer-card">
            <h3 class="text-white text-sm font-black mb-2">Labor Hours Log</h3>
            <p class="text-textMuted text-xs leading-relaxed">The clock is not on the home screen. It only runs when opened here and started manually.</p>
          </div>
        `;
      }

      return `
        <div class="drawer-card">
          <h3 class="text-white text-sm font-black mb-2">${name}</h3>
          <p class="text-textMuted text-xs leading-relaxed">${sub}. This module shell is ready for the next build phase.</p>
        </div>
        <div class="drawer-card">
          <h3 class="text-white text-sm font-black mb-2">Next Step</h3>
          <p class="text-textMuted text-xs leading-relaxed">Wire this screen into real job data, Supabase, scanner input, Rolling Wrench AI, and saved repair history.</p>
        </div>
      `;
    }

    const grid = document.getElementById("toolGrid");
    tools.forEach(([name, sub, icon, color]) => {
      const btn = document.createElement("button");
      btn.className = "studio-pressed-cavity rounded-xl p-3 flex flex-col items-center justify-between text-center min-h-[100px] transition-all group";
      const label = name === "Work Orders" ? "Work<br>Orders" : name;
      btn.innerHTML = `
        <div class="${color} text-xl mt-1 drop-shadow-[0_3px_6px_rgba(0,0,0,0.85)] group-hover:scale-110 transition-transform duration-200">
          <i class="fa-solid ${icon}"></i>
        </div>
        <div class="w-full">
          <span class="text-[10px] font-black text-white tracking-wide uppercase block leading-tight">${label}</span>
          <span class="text-[7.5px] text-textMuted mt-1 block leading-tight tracking-tight line-clamp-1 px-0.5">${sub}</span>
        </div>
      `;
      btn.addEventListener("click", () => drawer("MODULE", name, bodyFor(name, sub)));
      grid.appendChild(btn);
    });

    document.addEventListener("click", (e) => {
      const action = e.target.closest("[data-action]")?.dataset.action;
      if(!action) return;

      if(action === "close-drawer") closeDrawer();
      if(action === "scanner") drawer("SCANNER STATUS", "9-PIN / J1939", bodyFor("Scanner Status", "Heavy-duty datalink scanner status"));
      if(action === "profile") drawer("ACTIVE TRUCK", "Cascadia 126", bodyFor("Truck Profile", "Cummins X15, ESN 79876, J1939 datalink ready"));
      if(action === "health") drawer("SYSTEM HEALTH", "Vehicle Data 98%", bodyFor("System Health", "Vehicle data integrity and fault readiness"));
      if(action === "search") {
        const q = document.getElementById("masterSearch").value.trim() || "Master Search";
        drawer("SEARCH", q, bodyFor("Master Search", "VIN, part numbers, fault codes, symptoms, and repair notes"));
      }
      if(action === "open-menu") drawer("MENU", "Rolling Wrench Menu", bodyFor("Menu", "Quick access settings and technician tools"));
      if(action === "notifications") drawer("NOTIFICATIONS", "Alerts", bodyFor("Notifications", "Fault alerts, job updates, and scanner messages"));

      if(action === "clock-in") {
        if(!running){
          running = true;
          timer = setInterval(() => {
            seconds++;
            updateClock();
          }, 1000);
        }
      }
      if(action === "clock-out") {
        running = false;
        clearInterval(timer);
        updateClock();
      }
    });

    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-btn").forEach(b => {
          b.classList.remove("text-neonOrange");
          b.classList.add("text-[#4e5f73]");
        });
        btn.classList.remove("text-[#4e5f73]");
        btn.classList.add("text-neonOrange");
        const name = btn.dataset.nav;
        if(name !== "Home") drawer("NAVIGATION", name, bodyFor(name, `${name} dashboard`));
      });
    });
  </script>
</body>
</html>
