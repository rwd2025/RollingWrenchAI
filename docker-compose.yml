version: '3.8'
services:
  api:
    build: ./api
    container_name: diesel_doctor_api
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama_ai:11434/api/generate
      - OLLAMA_MODEL=llama3
  frontend:
    build: ./frontend
    container_name: diesel_doctor_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_WS_URL=ws://localhost:8000/ws/j1939
    depends_on:
      - api
